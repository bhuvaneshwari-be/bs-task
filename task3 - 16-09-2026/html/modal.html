<!DOCTYPE html>
<html>
    <head>
        <title>Modal Workout</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    </head>

    <body>
        <div class="container-fluid mt-5"></div>

            <h1 class="text-dark text-center">Join Our Learning Program</h1>
            <p class="text-center">
                Take the next step in your career by enrolling in one of our professional development programs.
            </p>

            <div class="text-center">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#form">
                    Register Now
                </button>
            </div>
        </div>


        <div class="modal fade" id="form">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Create Your Account</h5>
                        <buttom class="btn-close" data-bs-dismiss="modal"></buttom>
                    </div>

                    <div class="modal-body">
                        <p class="text-muted">
                            Fill in the details below to register for our learning program.
                        </p>

                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Full Name
                                </label>
                                <input type="text" class="form-control" id="name" placeholder="Enter your full name">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>
                                <input type="email" class="form-control" id="email" placeholder="Enter your email address">
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>
                                <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number">
                            </div>

                            <div class="mb-3">
                                <label for="dob" class="form-label">
                                    Date of Birth
                                </label>
                                <input type="date" class="form-control" id="dob" >
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>
                                <input type="password" class="form-control" id="password" placeholder="Create a password">
                            </div>

                            <div class="mb-3">
                                <label for="confirmpassword" class="form-label">
                                    Confirm Password
                                </label>
                                <input type="password" class="form-control" id="confirmpassword" placeholder="Re-enter your password">
                            </div>
                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-danger" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button class="btn btn-primary" >
                            Register
                        </button>
                    </div>
                </div>
            </div>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
