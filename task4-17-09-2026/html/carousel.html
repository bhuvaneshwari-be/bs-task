<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Carousel Workout</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <style>
            #myCarousel {
                width: 100%;
                margin: auto;
            }
            .carousel-item img {
                width: 100%;
                height: 730px;
                object-fit: cover;
            }
</style>
    </head>

    <body>
        <div id="myCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../assets/image1.avif" class="d-block w-100">
                </div>
                
                <div class="carousel-item">
                    <img src="../assets/image2.avif" class="d-block w-100">
                </div>
                
                <div class="carousel-item">
                    <img src="../assets/image3.avif" class="d-block w-100">
                </div>
                
                <div class="carousel-item">
                    <img src="../assets/image4.avif" class="d-block w-100">
                </div>
            </div>

            <button class="carousel-control-prev bg-dark" 
                    data-bs-target="#myCarousel" 
                    data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next bg-dark"
                    data-bs-target="#myCarousel"
                    data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
